name: Question or discussion
description: Ask a question or start a design discussion
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Questions and architecture discussions are welcome. Please provide enough context for others to help.
  - type: textarea
    id: question
    attributes:
      label: What would you like to know or discuss?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the relevant Task, capability, source, runner, environment, or design context.
